<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>private chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0f;
    color: #e8e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    padding: 12px 16px;
    background: #15151d;
    border-bottom: 1px solid #25252f;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header .name { font-weight: 700; font-size: 16px; }
  .header .status { font-size: 12px; color: #8888a0; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg.mine {
    align-self: flex-end;
    background: #5b3aff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.theirs {
    align-self: flex-start;
    background: #25252f;
    color: #e8e8f0;
    border-bottom-left-radius: 4px;
  }
  .msg .time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
    display: block;
  }
  .input-bar {
    padding: 12px;
    background: #15151d;
    border-top: 1px solid #25252f;
    display: flex;
    gap: 8px;
  }
  .input-bar input {
    flex: 1;
    background: #0a0a0f;
    border: 1px solid #25252f;
    color: #e8e8f0;
    padding: 12px 16px;
    border-radius: 24px;
    font-size: 14px;
    outline: none;
  }
  .input-bar input:focus { border-color: #5b3aff; }
  .input-bar button {
    background: #5b3aff;
    border: none;
    color: #fff;
    padding: 0 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .input-bar button:active { background: #4a2ecc; }

  .login {
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 100;
    padding: 20px;
  }
  .login h1 { font-size: 24px; margin-bottom: 8px; }
  .login input {
    width: 100%;
    max-width: 300px;
    background: #15151d;
    border: 1px solid #25252f;
    color: #e8e8f0;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
  }
  .login input:focus { border-color: #5b3aff; }
  .login button {
    width: 100%;
    max-width: 300px;
    background: #5b3aff;
    border: none;
    color: #fff;
    padding: 14px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .call-btn {
    background: transparent;
    border: none;
    color: #5b3aff;
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .call-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 200;
  }
  .call-overlay.active { display: flex; }
  .call-overlay .caller { font-size: 28px; font-weight: 700; }
  .call-overlay .call-status { font-size: 16px; color: #8888a0; }
  .call-overlay .call-actions { display: flex; gap: 16px; }
  .call-overlay button {
    padding: 16px 32px;
    border-radius: 32px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .call-overlay .accept { background: #2ecc71; color: #fff; }
  .call-overlay .decline { background: #e74c3c; color: #fff; }
</style>
</head>
<body>

<!-- ЛОГИН -->
<div class="login" id="login">
  <h1>приватный чат</h1>
  <input type="text" id="nameInput" placeholder="твоё имя" maxlength="20">
  <button onclick="doLogin()">войти</button>
</div>

<!-- ЧАТ -->
<div class="header">
  <div>
    <div class="name" id="chatWith">общий чат</div>
    <div class="status" id="userStatus">не подключён</div>
  </div>
  <button class="call-btn" id="callBtn" title="позвонить">📞</button>
</div>

<div class="messages" id="messages"></div>

<div class="input-bar">
  <input type="text" id="msgInput" placeholder="сообщение..." maxlength="500">
  <button onclick="sendMsg()">→</button>
</div>

<!-- ЗВОНОК -->
<div class="call-overlay" id="callOverlay">
  <div class="caller" id="callerName">...</div>
  <div class="call-status" id="callStatus">звонок...</div>
  <div class="call-actions" id="callActions">
    <button class="accept" onclick="acceptCall()">принять</button>
    <button class="decline" onclick="endCall()">сбросить</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ============================================================
// СОСТОЯНИЕ
// ============================================================
let socket = null;
let myName = '';
let myId = null;
let users = [];
let currentPeer = null;      // с кем говорим
let peerConnection = null;   // RTCPeerConnection
let localStream = null;      // моя медиа-стрим
let isCaller = false;

const ICE_SERVERS = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]
};

// ============================================================
// ЛОГИН
// ============================================================
function doLogin() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  myName = name;
  document.getElementById('login').style.display = 'none';
  connect();
}

// ============================================================
// ПОДКЛЮЧЕНИЕ
// ============================================================
function connect() {
  socket = io();

  socket.on('connect', () => {
    socket.emit('register', myName);
    document.getElementById('userStatus').textContent = 'онлайн';
  });

  socket.on('users', (list) => {
    users = list.filter(u => u.socketId !== socket.id);
    // если есть пользователи — выбираем первого
    if (users.length > 0) {
      currentPeer = users[0];
      document.getElementById('chatWith').textContent = currentPeer.name;
    } else {
      document.getElementById('chatWith').textContent = 'общий чат';
      currentPeer = null;
    }
  });

  // сообщения
  socket.on('message', (msg) => {
    addMessage(msg.from, msg.text, msg.time, false);
  });

  // ============================================================
  // ЗВОНКИ
  // ============================================================
  socket.on('incoming-call', async ({ from, offer, fromId }) => {
    isCaller = false;
    document.getElementById('callOverlay').classList.add('active');
    document.getElementById('callerName').textContent = from;
    document.getElementById('callStatus').textContent = 'входящий звонок';

    // сохраняем для accept
    window._pendingOffer = offer;
    window._pendingFromId = fromId;
    window._pendingFrom = from;
  });

  socket.on('call-accepted', async ({ answer }) => {
    if (peerConnection) {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
      document.getElementById('callStatus').textContent = 'соединено';
    }
  });

  socket.on('ice-candidate', async ({ candidate }) => {
    if (peerConnection) {
      try {
        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (e) { console.warn('ice err', e); }
    }
  });

  socket.on('call-ended', () => {
    endCall(true);
  });
}

// ============================================================
// ОТПРАВКА СООБЩЕНИЙ
// ============================================================
function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  const payload = {
    from: myName,
    text: text,
    time: Date.now()
  };

  if (currentPeer) {
    payload.to = currentPeer.socketId;
  }

  socket.emit('message', payload);
  addMessage(myName, text, Date.now(), true);
  input.value = '';
}

document.getElementById('msgInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMsg();
});

function addMessage(from, text, time, mine) {
  const div = document.createElement('div');
  div.className = 'msg ' + (mine ? 'mine' : 'theirs');
  const t = new Date(time);
  const timeStr = t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0');
  div.innerHTML = `<div>${escapeHtml(text)}</div><span class="time">${from} ${timeStr}</span>`;
  const messages = document.getElementById('messages');
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// ЗВОНКИ (WebRTC)
// ============================================================
document.getElementById('callBtn').onclick = async () => {
  if (!currentPeer) {
    alert('нет пользователя для звонка');
    return;
  }
  if (peerConnection) {
    alert('звонок уже идёт');
    return;
  }

  isCaller = true;

  // получаем микрофон
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    alert('нет доступа к микрофону');
    return;
  }

  peerConnection = new RTCPeerConnection(ICE_SERVERS);
  localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

  peerConnection.onicecandidate = (e) => {
    if (e.candidate) {
      socket.emit('ice-candidate', {
        to: currentPeer.socketId,
        candidate: e.candidate
      });
    }
  };

  // создаём offer
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);

  socket.emit('call-user', {
    to: currentPeer.socketId,
    offer: offer,
    from: myName
  });

  document.getElementById('callOverlay').classList.add('active');
  document.getElementById('callerName').textContent = currentPeer.name;
  document.getElementById('callStatus').textContent = 'звоним...';
  document.getElementById('callActions').innerHTML = `<button class="decline" onclick="endCall()">сбросить</button>`;
};

async function acceptCall() {
  if (!window._pendingOffer) return;
  isCaller = false;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    alert('нет доступа к микрофону');
    return;
  }

  peerConnection = new RTCPeerConnection(ICE_SERVERS);
  localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

  peerConnection.onicecandidate = (e) => {
    if (e.candidate) {
      socket.emit('ice-candidate', {
        to: window._pendingFromId,
        candidate: e.candidate
      });
    }
  };

  peerConnection.ontrack = (e) => {
    const audio = new Audio();
    audio.srcObject = e.streams[0];
    audio.play();
  };

  await peerConnection.setRemoteDescription(new RTCSessionDescription(window._pendingOffer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);

  socket.emit('call-accepted', {
    to: window._pendingFromId,
    answer: answer
  });

  document.getElementById('callStatus').textContent = 'соединено';
  document.getElementById('callActions').innerHTML = `<button class="decline" onclick="endCall()">сбросить</button>`;
}

function endCall(silent) {
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  if (!silent && currentPeer) {
    socket.emit('call-ended', { to: currentPeer.socketId });
  }
  document.getElementById('callOverlay').classList.remove('active');
  window._pendingOffer = null;
  window._pendingFromId = null;
  window._pendingFrom = null;
}
</script>
</body>
</html>
